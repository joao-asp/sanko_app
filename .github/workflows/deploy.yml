name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: sanko-api
  ROLE_ARN: arn:aws:iam::459742122840:role/sanko-gha-deploy

jobs:
  build-and-push:
    name: Build e push da imagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          docker tag "$IMAGE" "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:latest"
          docker push "${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:latest"

  deploy:
    name: Deploy na instância
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=Sanko-App" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          echo "Instância: $INSTANCE_ID"

          CMD_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --comment "deploy ${GITHUB_SHA}" \
            --parameters 'commands=["sudo -u ubuntu bash -lc \"cd /home/ubuntu/sanko && git fetch origin main && git reset --hard origin/main && bash scripts/deploy.sh\""]' \
            --query "Command.CommandId" --output text)
          echo "Comando SSM: $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
          echo "Status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "[StandardOutputContent, StandardErrorContent]" --output text
            exit 1
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://sanko.app.br/healthz || true)
            echo "attempt $i -> $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 3
          done
          echo "healthz não respondeu 200"
          exit 1

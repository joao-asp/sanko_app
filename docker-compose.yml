services:
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./frontend:/srv
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ${API_IMAGE:-459742122840.dkr.ecr.us-east-1.amazonaws.com/sanko-api:latest}
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # SQLite persistido no volume nomeado
      DATABASE_URL: file:/data/sanko.db
    volumes:
      - sanko_data:/data
    expose:
      - "3000"

volumes:
  caddy_data:
  caddy_config:
  sanko_data:
